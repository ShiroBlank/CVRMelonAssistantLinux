[package]
name = "cvr-melon-assistant"
version = "1.0.0"
edition = "2021"
description = "CVR MelonLoader Assistant for Linux - Ported from C#/WPF"
authors = ["CVRMelonAssistant Contributors"]

[[bin]]
name = "cvr-melon-assistant"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.7", features = ["v4_10"] }
glib = "0.18"
gio = "0.18"
gdk4 = "0.7"
pango = "0.18"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "native-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
md5 = "0.7"
dirs = "5"
anyhow = "1"
once_cell = "1"
regex = "1"
send_wrapper = "0.6"
